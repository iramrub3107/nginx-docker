server {
    listen 80;
    server_name izan.test;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api {
        satisfy all;

        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        auth_basic "Zona segura";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}